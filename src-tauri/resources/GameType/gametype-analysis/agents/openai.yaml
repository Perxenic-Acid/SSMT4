interface:
  display_name: "GameType Analysis"
  short_description: "Check current-game DrawIB list against GameType data types"
  default_prompt: "Use MCP to get the settings path (GlobalConfig.AppSettingsFilePath) and the resources folder (GlobalConfig.SSMTResourcesFolder). The GameType library is <resources folder>/GameType, the data-type folder shipped with the install. Then run `python -u scripts/gametype_add_missing_types.py --settings-file "<settings>" --gametype-root "<gametype-root>" --dry-run` in the skill directory, and only run the real pass (drop --dry-run) when the summary reports new > 0. The script audits the current workspace DrawIB list (not every IB in the dump), resolves the pre-skinning pointlist draw for GPU-skinned meshes, matches each IB against the GameType registry, and reports covered / unable / new in one summary. It deduplicates missing layouts, writes one JSON per distinct missing type, and packages them into a shareable zip. Do not manually grep log.txt or list dump files; trust the script summary."
